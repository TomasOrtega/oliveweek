<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="A free meal planner with recipes, photographs, batch cooking and grocery lists. No account required.">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>OliveWeek — meal planner</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="header">
<a class="wordmark" href="#plan" aria-label="OliveWeek home"><img src="assets/mark.svg" alt="" width="24" height="24">OliveWeek</a>
<nav aria-label="Main navigation">
<a href="#plan">Plan</a><a href="#recipes">Recipes</a><a href="#shopping">Shopping</a><a href="#prep">Prep</a><a href="#pantry">Pantry</a><a href="#saved">Saved</a>
</nav>
<button data-action="settings" class="quiet">Settings</button>
</header>
<div id="notice" class="notice" role="status" hidden></div>
<main id="main" tabindex="-1"><p class="muted">Loading recipes…</p></main>
<footer><span>Free. No account. Saved on this device.</span><button data-action="about" class="link">About & sources</button><button data-action="backup" class="link">Export backup</button><button data-action="import" class="link">Import backup</button><a href="https://github.com/TomasOrtega/oliveweek" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-heading"><h2 id="dialog-title"></h2><button data-action="close" aria-label="Close dialog">Close</button></div><div id="dialog-body"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="backup-file" accept="application/json,.json" hidden>
<noscript><p>OliveWeek needs JavaScript for local meal planning. No information is sent to a backend.</p></noscript>
</body>
</html>
