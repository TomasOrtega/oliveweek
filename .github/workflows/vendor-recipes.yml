name: Vendor recipe collection
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/vendor_recipes.py
      - .github/workflows/vendor-recipes.yml
permissions:
  contents: write
concurrency:
  group: vendor-recipes
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.12'
      - name: Download pinned public-domain recipes and photographs
        run: uv run --locked --no-dev python scripts/vendor_recipes.py
      - name: Commit vendored source and assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/community.json assets/recipes vendor/based-cooking
          if ! git diff --cached --quiet; then
            git commit -m 'Vendor pinned public-domain recipes and photographs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Export review bundle
        uses: actions/upload-artifact@v7
        with:
          name: community-recipes
          path: |
            data/community.json
            assets/recipes
            vendor/based-cooking
          retention-days: 7
